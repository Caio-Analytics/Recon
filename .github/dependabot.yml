version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # Só propõe versões publicadas há pelo menos 14 dias: ataques de supply chain
    # costumam ser detectados e removidos nos primeiros dias.
    cooldown:
      default-days: 14
    # Um único PR por mês com todas as atualizações de versão.
    groups:
      dependencias-python:
        patterns: ["*"]
    # Estes pacotes mudam resultados ou interface e precisam de conferência
    # manual antes de subir de versão. Alertas de segurança continuam chegando.
    ignore:
      - dependency-name: "statsmodels"
      - dependency-name: "PySide6"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
