[project]
name = "recon"
version = "3.0.0"
description = "Recon — reconhecimento de dados: descubra o que tem num arquivo desconhecido antes de analisar."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caio" }]
keywords = ["data-profiling", "data-quality", "data-privacy", "schema-inference", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "pyarrow==26.0.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "pyxlsb==1.0.10",
    "charset-normalizer==3.5.2",
    "rapidfuzz==3.14.6",
    "unidecode==1.4.0",
    "scipy==1.18.1",
    "statsmodels==0.14.6",
    "pyyaml==6.0.3",
    "loguru==0.7.3",
    "typer==0.28.0",
    "rich==15.0.0",
    "tqdm==4.70.1",
    "duckdb==2.0.0",
    "weasyprint==70.0",
    "pillow>=13.0.0",   # piso de segurança: versões anteriores têm CVEs (transitiva do weasyprint)
    "brotli>=1.2.1",    # piso de segurança: CVE-2026-111497 (transitiva do fonttools)
]

[project.optional-dependencies]
gui = [
    "PySide6==6.10.2",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pandas-stubs==3.1.0.261029",
    "types-PyYAML==6.0.12.20261103",
    "mypy==2.4.1",
    "ruff==0.17.6",
    "pip-tools==7.6.2",
    "playwright==1.65.2",
]

[project.urls]
Homepage = "https://github.com/Caio-Analytics/Recon"
Documentation = "https://github.com/Caio-Analytics/Recon/blob/main/docs/GUIA.md"
Issues = "https://github.com/Caio-Analytics/Recon/issues"
Changelog = "https://github.com/Caio-Analytics/Recon/blob/main/CHANGELOG.md"

[project.scripts]
recon = "recon.cli:app"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # comprimento de linha é responsabilidade do formatter
    "B008",   # typer.Option no default é o idioma da biblioteca
]

[tool.mypy]
python_version = "3.12"
files = ["src/recon"]
ignore_missing_imports = true
warn_unused_ignores = true
